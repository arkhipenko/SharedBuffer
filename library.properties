name=SharedBuffer
version=1.0.0
author=Anatoli Arkhipenko <arkhipenko@hotmail.com>
maintainer=Anatoli Arkhipenko <arkhipenko@hotmail.com>
sentence=One memory pool shared by buffers that are not used at the same time.
paragraph=Each user registers a named buffer and its size. The pool is allocated once (heap or static array) at the size of the largest registration or more. acquire() places a buffer in a free gap of the pool and holds it until release(), and fails when the memory is in use. Safe from tasks and interrupts on AVR, SAMD, nRF52 and ESP32.
category=Other
url=https://github.com/arkhipenko/SharedBuffer
architectures=*
includes=SharedBuffer.h
